name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --draft

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Update Rust
        run: rustup update stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf casparcg-osc-companion-timer-linux-x86_64.tar.gz -C target/release casparcg-osc-companion-timer

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tar -czf casparcg-osc-companion-timer-macos-arm64.tar.gz -C target/release casparcg-osc-companion-timer

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/release/casparcg-osc-companion-timer.exe casparcg-osc-companion-timer-windows-x86_64.exe

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" casparcg-osc-companion-timer-* --repo "$GITHUB_REPOSITORY"
